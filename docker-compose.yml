version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: sih-postgres
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih2026
      POSTGRES_DB: mahasetu
    ports:
    - 5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - sih-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U sih -d mahasetu
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    container_name: sih-redis
    ports:
    - 6379:6379
    networks:
    - sih-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 3
  dept-a:
    build:
      context: .
      dockerfile: ./backend/departments/dept-a/Dockerfile
    container_name: sih-dept-a
    ports:
    - 3001:3001
    networks:
    - sih-network
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sih:sih2026@postgres:5432/mahasetu
      REDIS_URL: redis://redis:6379
      IDENTITY_URL: http://identity:3020
      MDM_URL: http://mdm:3030
      CONSENT_URL: http://consent:3040
      EVENT_BUS_URL: http://event-bus:3050
      WORKFLOW_URL: http://workflow:3060
      AUDIT_URL: http://audit:3070
      DEPT_A_URL: http://dept-a:3001
      DEPT_B_URL: http://dept-b:3002
      DEPT_C_URL: http://dept-c:3003
      ADAPTER_A_URL: http://adapter-a:3011
      ADAPTER_B_URL: http://adapter-b:3012
      ADAPTER_C_URL: http://adapter-c:3013
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://localhost:3001/health'').then(r => process.exit(r.ok ? 0 :
        1)).catch(() => process.exit(1))'
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
    - dept-a-data:/app/data
  dept-b:
